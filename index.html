<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schooltaalwoorden Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,900;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c84b31;
    --accent2: #2d6a4f;
    --muted: #8a8070;
    --card: #fffef9;
    --border: #d4c9b0;
    --gold: #e8a838;
    --correct: #2d6a4f;
    --wrong: #c84b31;
    --neutral: #4a6fa5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 20%, rgba(200,75,49,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(45,106,79,0.06) 0%, transparent 60%);
  }

  /* SCREEN MANAGEMENT */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  .site-header {
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--ink); }

  .round-badge {
    font-size: 0.8rem;
    background: var(--border);
    padding: 0.25rem 0.75rem;
    border-radius: 100px;
    font-weight: 500;
  }

  /* SCORE BADGE */
  .score-badge {
    margin-left: auto;
    background: var(--ink);
    color: var(--paper);
    padding: 0.4rem 1rem;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 500;
    font-family: 'Fraunces', serif;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    height: 4px;
    background: var(--border);
    width: 100%;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  /* ===== SETUP SCREEN ===== */
  #setup {
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  .setup-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(26,26,46,0.08);
  }
  .setup-card h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2.4rem;
    line-height: 1.1;
    margin-bottom: 0.5rem;
    color: var(--ink);
  }
  .setup-card h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .setup-card p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 2rem;
    line-height: 1.5;
  }
  .setup-section { margin-bottom: 1.8rem; }
  .setup-section label {
    display: block;
    font-weight: 500;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.8rem;
  }
  .pill-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .pill {
    padding: 0.5rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    transition: all 0.15s;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .btn-start {
    width: 100%;
    padding: 1rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 4px 16px rgba(200,75,49,0.3);
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,75,49,0.4); }
  .btn-start:active { transform: translateY(0); }
  .btn-start:disabled { background: var(--muted); cursor: not-allowed; box-shadow: none; }

  /* ===== QUIZ SCREEN ===== */
  #quiz {
    padding: 0;
  }
  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 620px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(26,26,46,0.07);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .q-type-badge {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    color: var(--muted);
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 0.25rem 0.75rem;
    border-radius: 100px;
  }
  .q-counter {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: 'Fraunces', serif;
  }

  .question-text {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.5;
    margin-bottom: 1.8rem;
    color: var(--ink);
  }
  .question-text .blank {
    display: inline-block;
    border-bottom: 2.5px solid var(--accent);
    min-width: 120px;
    color: var(--accent);
    font-weight: 600;
    font-style: italic;
  }

  .answer-input-wrap {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .answer-input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    background: var(--paper);
    outline: none;
    transition: border-color 0.15s;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--correct); background: rgba(45,106,79,0.06); }
  .answer-input.wrong { border-color: var(--wrong); background: rgba(200,75,49,0.06); }

  .btn-check {
    padding: 0.85rem 1.5rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-check:hover { background: var(--accent); }

  /* MULTIPLE CHOICE */
  .mc-options {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .mc-btn {
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .mc-btn:hover:not(:disabled) { border-color: var(--neutral); background: rgba(74,111,165,0.05); }
  .mc-btn.correct-mc { border-color: var(--correct); background: rgba(45,106,79,0.08); color: var(--correct); font-weight: 500; }
  .mc-btn.wrong-mc { border-color: var(--wrong); background: rgba(200,75,49,0.08); color: var(--wrong); }
  .mc-btn:disabled { cursor: default; }
  .mc-letter {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    flex-shrink: 0;
    color: var(--muted);
  }
  .mc-btn.correct-mc .mc-letter { background: var(--correct); color: white; }
  .mc-btn.wrong-mc .mc-letter { background: var(--wrong); color: white; }

  /* FEEDBACK PANEL */
  .feedback-panel {
    margin-top: 1.5rem;
    padding: 1.4rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--paper);
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .feedback-panel.fb-correct { border-color: rgba(45,106,79,0.3); background: rgba(45,106,79,0.04); }
  .feedback-panel.fb-wrong { border-color: rgba(200,75,49,0.3); background: rgba(200,75,49,0.04); }

  .fb-header {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .fb-header.fc { color: var(--correct); }
  .fb-header.fw { color: var(--wrong); }

  .fb-row { margin-bottom: 0.6rem; font-size: 0.9rem; line-height: 1.5; }
  .fb-row strong {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: block;
    margin-bottom: 0.15rem;
  }
  .fb-word { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; color: var(--ink); }
  .fb-sentence .highlight { font-weight: 600; color: var(--accent); }

  .btn-next {
    margin-top: 1.2rem;
    width: 100%;
    padding: 0.85rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-next:hover { background: var(--accent2); }

  /* ===== RESULTS SCREEN ===== */
  #results {
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  .results-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(26,26,46,0.08);
  }
  .results-score-big {
    text-align: center;
    margin-bottom: 2rem;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    background: var(--paper);
  }
  .score-num {
    font-family: 'Fraunces', serif;
    font-size: 2.8rem;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
  }
  .score-denom {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    color: var(--muted);
  }
  .score-label {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }
  .score-sub { color: var(--muted); font-size: 0.9rem; }

  .missed-section { margin-top: 1.5rem; }
  .missed-section h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 1rem;
    color: var(--wrong);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .missed-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 240px; overflow-y: auto; }
  .missed-item {
    display: flex;
    gap: 1rem;
    padding: 0.7rem 0.9rem;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .missed-word { font-family: 'Fraunces', serif; font-weight: 600; min-width: 120px; color: var(--ink); }
  .missed-def { color: var(--muted); }

  .results-actions { margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .btn-retry-all {
    padding: 0.9rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-retry-all:hover { background: var(--accent); }
  .btn-retry-missed {
    padding: 0.9rem;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-retry-missed:hover { background: var(--accent); color: white; }
  .btn-retry-missed:disabled { opacity: 0.4; cursor: default; }
  
  .adaptive-summary { margin-top: 1.5rem; padding: 1rem; background: #eaf2f8; border-radius: 8px; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="setup" class="screen active">
  <div class="setup-card">
    <h1>School&shy;taal&shy;<em>woorden</em></h1>
    <p id="setup-message">Woordjes laden uit CSV-bestand...</p>

    <div class="setup-section">
      <label>Vraagtype</label>
      <div class="pill-group" id="mode-pills">
        <button class="pill selected" data-value="mixed">Afwisselend</button>
        <button class="pill" data-value="sentence">Alleen zinnen</button>
        <button class="pill" data-value="meaning">Alleen betekenis</button>
      </div>
    </div>

    <div class="setup-section">
      <label>Welke les?</label>
      <div class="pill-group" id="les-pills">
        <button class="pill selected" data-value="all">Alle lessen</button>
      </div>
    </div>

    <div class="setup-section">
      <label>Aantal woorden</label>
      <div class="pill-group" id="count-pills">
        <button class="pill selected" data-value="all">Alle</button>
        <button class="pill" data-value="10">10</button>
        <button class="pill" data-value="20">20</button>
        <button class="pill" data-value="30">30</button>
        <button class="pill" data-value="50">50</button>
      </div>
    </div>

    <div class="setup-section">
      <label>Oefenmodus</label>
      <div class="pill-group" id="practice-pills">
        <button class="pill selected" data-value="standard">Standaard</button>
        <button class="pill" data-value="adaptive">Adaptief</button>
      </div>
    </div>

    <button class="btn-start" id="btn-start" onclick="startQuiz()" disabled>Start de quiz →</button>
  </div>
</div>

<div id="quiz" class="screen">
  <header class="site-header">
    <div class="logo">Taal<span>woorden</span></div>
    <div class="round-badge" id="round-display">Hoofdronde</div>
    <div class="score-badge" id="score-display">Score: 0</div>
  </header>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="quiz-body">
    <div class="question-card" id="question-card">
      </div>
  </div>
</div>

<div id="results" class="screen">
  <div class="results-card">
    <div class="results-score-big">
      <div class="score-circle">
        <div class="score-num" id="res-score">0</div>
        <div class="score-denom" id="res-max">/0</div>
      </div>
      <div class="score-label" id="res-label">Goed gedaan!</div>
      <div class="score-sub" id="res-sub"></div>
    </div>

    <div class="missed-section" id="missed-section">
      <h3>❌ Gemiste woorden</h3>
      <div class="missed-list" id="missed-list"></div>
    </div>

    <div class="results-actions">
      <button class="btn-retry-all" onclick="retryAll()">↺ Opnieuw met alle woorden</button>
      <button class="btn-retry-missed" id="btn-retry-missed" onclick="retryMissed()">↺ Opnieuw met gemiste woorden</button>
    </div>
  </div>
  <div class="adaptive-summary" id="adaptive-summary" style="display:none;"></div>
</div>

<script>
// ===== GLOBALE VARIABELEN & INSTELLINGEN =====
let DATA = []; 
const CSV_FILE = 'Schooltaalwoorden met betekenis en voorbeeldzinnen.csv';

let selectedWords = [];
let currentIndex = 0;
let score = 0;
let missedWords = [];
let currentQuestion = null;

// Adaptieve modus variabelen
let isAdaptiveMode = false;
let adaptiveQueue = [];
let wordWeights = {}; 

// Setup selecties
let config = { mode: 'mixed', les: 'all', count: 'all', practice: 'standard' };

// ===== CSV LAAD- EN PARSEFUNCTIE =====
document.addEventListener("DOMContentLoaded", () => {
  setupPillListeners();
  loadCSVData();
});

function loadCSVData() {
  fetch(CSV_FILE)
    .then(response => {
      if (!response.ok) throw new Error("Kan het CSV-bestand niet vinden.");
      return response.text();
    })
    .then(text => {
      DATA = parseCSV(text);
      if (DATA.length === 0) throw new Error("Geen geldige gegevens gevonden in de CSV.");
      
      document.getElementById('setup-message').innerText = `Succesvol ${DATA.length} woorden ingeladen uit de CSV!`;
      document.getElementById('btn-start').disabled = false;
      buildLesFilters();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('setup-message').innerHTML = `<span style="color:var(--wrong)">Fout bij laden CSV: Plaats '${CSV_FILE}' in dezelfde map.</span>`;
    });
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  const result = [];
  if (lines.length <= 1) return result;

  // Header controleren (Woord;Omschrijving;Voorbeeldzin 1;Voorbeeldzin 2;Voorbeeldzin 3;Les)
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // Splitsen op puntkomma
    const columns = line.split(';');
    if (columns.length >= 2) {
      const zinnen = [];
      // Verzamel de voorbeeldzinnen uit kolommen C, D en E (index 2, 3, 4) indien aanwezig
      for (let j = 2; j <= 4; j++) {
        if (columns[j] && columns[j].trim()) {
          zinnen.push(columns[j].trim());
        }
      }

      result.push({
        Woord: columns[0].trim(),
        Omschrijving: columns[1].trim(),
        Voorbeeldzinnen: zinnen, // Array met tot wel 3 zinnen
        Les: columns[5] ? columns[5].trim() : 'Onbekend'
      });
    }
  }
  return result;
}

function buildLesFilters() {
  const lessen = [...new Set(DATA.map(w => w.Les))].sort();
  const container = document.getElementById('les-pills');
  lessen.forEach(les => {
    if (!les) return;
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.setAttribute('data-value', les);
    btn.innerText = les;
    container.appendChild(btn);
  });
  setupPillListeners(); // Reset listeners om nieuwe knoppen mee te nemen
}

function setupPillListeners() {
  const groups = ['mode-pills', 'les-pills', 'count-pills', 'practice-pills'];
  groups.forEach(id => {
    const container = document.getElementById(id);
    if (!container) return;
    container.querySelectorAll('.pill').forEach(pill => {
      pill.onclick = (e) => {
        container.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
        e.target.classList.add('selected');
        
        const type = id.split('-')[0];
        config[type] = e.target.getAttribute('data-value');
      };
    });
  });
}

// ===== QUIZ LOGICA =====
function startQuiz() {
  // Filteren op les
  let filtered = [...DATA];
  if (config.les !== 'all') {
    filtered = filtered.filter(w => w.Les === config.les);
  }

  if (filtered.length === 0) {
    alert("Geen woorden gevonden voor deze selectie!");
    return;
  }

  // Shuffelen
  shuffle(filtered);

  // Filteren op aantal
  if (config.count !== 'all') {
    const limit = parseInt(config.count, 10);
    filtered = filtered.slice(0, limit);
  }

  selectedWords = filtered;
  currentIndex = 0;
  score = 0;
  missedWords = [];
  isAdaptiveMode = (config.practice === 'adaptive');

  if (isAdaptiveMode) {
    adaptiveQueue = selectedWords.map(w => ({ wordObj: w, round: 1 }));
    selectedWords.forEach(w => { wordWeights[w.Woord] = 1; });
    document.getElementById('round-display').style.display = 'inline-block';
    document.getElementById('round-display').innerText = "Hoofdronde";
  } else {
    document.getElementById('round-display').style.display = 'none';
  }

  showScreen('quiz');
  nextQuestion();
}

function nextQuestion() {
  const card = document.getElementById('question-card');
  card.innerHTML = '';
  document.getElementById('score-display').innerText = `Score: ${score}`;

  if (isAdaptiveMode) {
    if (adaptiveQueue.length === 0) {
      endQuiz();
      return;
    }
    const currentItem = adaptiveQueue[currentIndex];
    currentQuestion = currentItem.wordObj;
    document.getElementById('round-display').innerText = currentItem.round === 1 ? "Hoofdronde" : `Herhaling (Ronde ${currentItem.round})`;
    document.getElementById('progress-bar').style.width = `100%`; 
  } else {
    if (currentIndex >= selectedWords.length) {
      endQuiz();
      return;
    }
    currentQuestion = selectedWords[currentIndex];
    const pct = (currentIndex / selectedWords.length) * 100;
    document.getElementById('progress-bar').style.width = `${pct}%`;
  }

  const qCounterText = isAdaptiveMode ? `Item ${currentIndex + 1}/${adaptiveQueue.length}` : `Vraag ${currentIndex + 1}/${selectedWords.length}`;

  // Bepaal type vraag (Zin invullen of Betekenis)
  let type = config.mode;
  if (type === 'mixed') {
    type = Math.random() > 0.5 ? 'sentence' : 'meaning';
  }

  // Fallback als er per ongeluk geen voorbeeldzinnen zijn gedefinieerd
  if (type === 'sentence' && (!currentQuestion.Voorbeeldzinnen || currentQuestion.Voorbeeldzinnen.length === 0)) {
    type = 'meaning';
  }

  if (type === 'sentence') {
    // KIES HIER WILLEKEURIG 1 VAN DE DRIE VOORBEELDZINNEN UIT DE CSV
    const zinnen = currentQuestion.Voorbeeldzinnen;
    const gekozenZin = zinnen[Math.floor(Math.random() * zinnen.length)];
    
    // Bewaar gekozen zin tijdelijk in het object voor de feedbacksectie
    currentQuestion._gekozenZin = gekozenZin;

    // Maskeer het woord in de zin (case insensitive)
    const regex = new RegExp(escapeRegExp(currentQuestion.Woord), 'gi');
    const maskedText = gekozenZin.replace(regex, `<span class="blank">......</span>`);

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-type-badge">Vul de zin aan</span>
        <span class="q-counter">${qCounterText}</span>
      </div>
      <div class="question-text">"${maskedText}"</div>
      <div class="answer-input-wrap">
        <input type="text" id="typed-ans" class="answer-input" placeholder="Typ het ontbrekende schooltaalwoord..." autocomplete="off">
        <button class="btn-check" onclick="checkTypedAnswer()">Controleer</button>
      </div>
    `;
    
    document.getElementById('typed-ans').focus();
    document.getElementById('typed-ans').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkTypedAnswer();
    });

  } else {
    // Betekenis (Multiple Choice)
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-type-badge">Wat betekent dit woord?</span>
        <span class="q-counter">${qCounterText}</span>
      </div>
      <div class="question-text" style="font-weight:600; font-size:1.8rem; text-align:center; color:var(--accent);">
        ${currentQuestion.Woord}
      </div>
      <div class="mc-options" id="mc-options-container"></div>
    `;

    // Genereer foute alternatieven uit de overige dataset
    let distractors = DATA.filter(w => w.Woord !== currentQuestion.Woord);
    shuffle(distractors);
    let options = [currentQuestion, distractors[0], distractors[1], distractors[2]].filter(Boolean);
    shuffle(options);

    const letters = ['A', 'B', 'C', 'D'];
    const container = document.getElementById('mc-options-container');

    options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'mc-btn';
      btn.innerHTML = `<span class="mc-letter">${letters[idx]}</span> <span class="mc-text">${escapeHtml(opt.Omschrijving)}</span>`;
      btn.onclick = () => checkMcAnswer(opt.Woord, btn);
      container.appendChild(btn);
    });
  }
}

function checkTypedAnswer() {
  const input = document.getElementById('typed-ans');
  if (!input || input.disabled) return;

  const userAns = input.value.trim().toLowerCase();
  const correctAns = currentQuestion.Woord.toLowerCase();
  const isCorrect = (userAns === correctAns);

  input.disabled = true;
  if (isCorrect) {
    input.classList.add('correct');
    score++;
    handleAnswerFeedback(true);
  } else {
    input.classList.add('wrong');
    if (!missedWords.some(w => w.Woord === currentQuestion.Woord)) {
      missedWords.push(currentQuestion);
    }
    handleAnswerFeedback(false);
  }
}

function checkMcAnswer(selectedWord, clickedBtn) {
  const container = document.getElementById('mc-options-container');
  const buttons = container.querySelectorAll('.mc-btn');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = (selectedWord === currentQuestion.Woord);

  if (isCorrect) {
    clickedBtn.classList.add('correct-mc');
    score++;
    handleAnswerFeedback(true);
  } else {
    clickedBtn.classList.add('wrong-mc');
    if (!missedWords.some(w => w.Woord === currentQuestion.Woord)) {
      missedWords.push(currentQuestion);
    }
    // Toon de juiste knop
    buttons.forEach(b => {
      if (b.innerText.includes(currentQuestion.Omschrijving)) {
        b.classList.add('correct-mc');
      }
    });
    handleAnswerFeedback(false);
  }
}

function handleAnswerFeedback(isCorrect) {
  const card = document.getElementById('question-card');
  
  // Highlight het woord in de getoonde voorbeeldzin
  let zinFeedback = "";
  if (currentQuestion._gekozenZin) {
    zinFeedback = currentQuestion._gekozenZin;
  } else {
    // Pak willekeurig eentje als er gekozen was voor betekenis-modus
    const zinnen = currentQuestion.Voorbeeldzinnen;
    zinFeedback = zinnen.length > 0 ? zinnen[Math.floor(Math.random() * zinnen.length)] : "";
  }

  if (zinFeedback) {
    const regex = new RegExp(escapeRegExp(currentQuestion.Woord), 'gi');
    zinFeedback = zinFeedback.replace(regex, match => `<span class="highlight">${match}</span>`);
  }

  const fbPanel = document.createElement('div');
  fbPanel.className = `feedback-panel ${isCorrect ? 'fb-correct' : 'fb-wrong'}`;
  fbPanel.innerHTML = `
    <div class="fb-header ${isCorrect ? 'fc' : 'fw'}">
      ${isCorrect ? '✓ Helemaal juist!' : '❌ Helaas, niet correct.'}
    </div>
    <div class="fb-row">
      <strong>Het woord</strong>
      <div class="fb-word">${currentQuestion.Woord} <span style="font-size:0.9rem; font-weight:normal; color:var(--muted)">(${currentQuestion.Les})</span></div>
    </div>
    <div class="fb-row">
      <strong>Betekenis</strong>
      <div>${currentQuestion.Omschrijving}</div>
    </div>
    ${zinFeedback ? `
    <div class="fb-row">
      <strong>Voorbeeldcontext</strong>
      <div class="fb-sentence">"${zinFeedback}"</div>
    </div>` : ''}
    <button class="btn-next" id="btn-next-q" onclick="advanceQuiz(${isCorrect})">Volgende vraag →</button>
  `;

  card.appendChild(fbPanel);
  document.getElementById('btn-next-q').focus();
}

function advanceQuiz(lastAnswerWasCorrect) {
  if (isAdaptiveMode) {
    const currentItem = adaptiveQueue[currentIndex];
    
    if (lastAnswerWasCorrect) {
      wordWeights[currentQuestion.Woord] = Math.max(0, (wordWeights[currentQuestion.Woord] || 1) - 1);
      // Verwijder uit de lopende queue
      adaptiveQueue.splice(currentIndex, 1);
      // currentIndex blijft hierdoor gelijk (wijst naar het volgende item)
    } else {
      wordWeights[currentQuestion.Woord] = (wordWeights[currentQuestion.Woord] || 1) + 1;
      // Verplaats naar het einde van de huidige ronde/wachtrij
      const item = adaptiveQueue.splice(currentIndex, 1)[0];
      item.round += 1;
      adaptiveQueue.push(item);
      // currentIndex schuift niet op omdat we het element gewist hebben
    }
    
    // Als we aan het einde van de lopende queue zijn, reset naar 0
    if (currentIndex >= adaptiveQueue.length) {
      currentIndex = 0;
    }
  } else {
    currentIndex++;
  }
  
  nextQuestion();
}

function endQuiz() {
  showScreen('results');
  
  const maxScore = isAdaptiveMode ? selectedWords.length : selectedWords.length;
  document.getElementById('res-score').innerText = score;
  document.getElementById('res-max').innerText = `/${maxScore}`;

  const ratio = score / maxScore;
  let label = "Goed geprobeerd!";
  if (ratio >= 0.9) label = "Uitstekend! Super gedaan! 🌟";
  else if (ratio >= 0.7) label = "Knap gedaan! Al heel goed op weg! 👍";
  else if (ratio >= 0.5) label = "Voldoende, maar blijf oefenen! 📚";
  
  document.getElementById('res-label').innerText = label;

  // Feedbacktekst bouwen
  let subText = `Je overliep in totaal ${selectedWords.length} unieke schooltaalwoorden.`;
  if (isAdaptiveMode) {
    subText += `<br>De adaptieve trainer heeft geoefend tot alle woorden foutloos gekend waren.`;
  }
  document.getElementById('res-sub').innerHTML = subText;

  // Gemiste lijst invullen
  const missedList = document.getElementById('missed-list');
  const missedSection = document.getElementById('missed-section');
  const btnRetryMissed = document.getElementById('btn-retry-missed');

  if (missedWords.length === 0) {
    missedSection.style.display = 'none';
    btnRetryMissed.disabled = true;
    missedList.innerHTML = '';
  } else {
    missedSection.style.display = 'block';
    btnRetryMissed.disabled = false;
    missedList.innerHTML = missedWords.map(w => `
      <div class="missed-item">
        <div class="missed-word">${escapeHtml(w.Woord)}</div>
        <div class="missed-def">${escapeHtml(w.Omschrijving)}</div>
      </div>
    `).join('');
  }
}

function retryAll() {
  startQuiz();
}

function retryMissed() {
  if (missedWords.length === 0) return;
  selectedWords = [...missedWords];
  currentIndex = 0;
  score = 0;
  missedWords = [];
  
  if (isAdaptiveMode) {
    adaptiveQueue = selectedWords.map(w => ({ wordObj: w, round: 1 }));
  }
  showScreen('quiz');
  nextQuestion();
}

// ===== UTILS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[arr[j]]] = [arr[arr[j]], arr[i]];
  }
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
